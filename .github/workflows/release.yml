name: Verificar y publicar LUMEN Tauri

on:
  push:
    branches: [main, migrate/tauri]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumen-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          version: 10.32.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: pnpm
      - name: Verificar versiones y etiqueta
        run: |
          $version = node -p "require('./package.json').version"
          $nativeVersion = node -p "require('./src-tauri/tauri.conf.json').version"
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"$' | Select-Object -First 1).Matches.Groups[1].Value
          if ($version -ne $nativeVersion -or $version -ne $cargoVersion) { throw 'Las versiones de package.json, Tauri y Cargo deben coincidir' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'La etiqueta debe coincidir con package.json' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: node --test scripts/release-metadata.test.mjs
      - run: pnpm build
      - name: Preparar Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo preparar Rust' }
          rustup default stable
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

  release:
    needs: verify
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          version: 10.32.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Preparar Rust
        run: |
          rustup toolchain install stable --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo preparar Rust' }
          rustup default stable
      - name: Comprobar disponibilidad de firma
        id: signing
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_KEY)) {
            'enabled=false' >> $env:GITHUB_OUTPUT
            Write-Output '::warning title=Publicación bloqueada sin firma::Falta el secreto TAURI_SIGNING_PRIVATE_KEY. Un administrador debe configurarlo con la clave correspondiente a la clave pública de Tauri; TAURI_SIGNING_PRIVATE_KEY_PASSWORD es opcional. Se generará solo un instalador de revisión sin latest.json y no se publicará una versión.'
          } else {
            'enabled=true' >> $env:GITHUB_OUTPUT
          }
      - name: Crear instalador NSIS firmado para el actualizador
        if: steps.signing.outputs.enabled == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles nsis
      - name: Crear instalador de revisión sin firma del actualizador
        if: steps.signing.outputs.enabled != 'true'
        run: |
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -Encoding utf8NoBOM "$env:RUNNER_TEMP/lumen-unsigned.json"
          pnpm tauri build --bundles nsis --config "$env:RUNNER_TEMP/lumen-unsigned.json"
      - name: Preparar manifiesto firmado y SHA-256
        if: steps.signing.outputs.enabled == 'true'
        run: node scripts/release-metadata.mjs
      - name: Preparar sumas de revisión sin manifiesto
        if: steps.signing.outputs.enabled != 'true'
        run: node scripts/release-metadata.mjs --unsigned
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LUMEN-Tauri-Windows-${{ steps.signing.outputs.enabled == 'true' && 'signed' || 'unsigned-review' }}
          retention-days: 7
          path: release/tauri/*
          if-no-files-found: error
      - name: Publicar versión firmada en GitHub Releases
        if: github.ref_type == 'tag' && steps.signing.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath release/tauri -File | ForEach-Object { $_.FullName })
          gh release create $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --verify-tag --title "LUMEN $env:GITHUB_REF_NAME" --notes-file release/tauri/release-notes.md @assets
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo publicar la versión; no se reemplazan publicaciones existentes' }
